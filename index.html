<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  <section class="header">
    <h1>Jogo da memória CHAMPIONS</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>  
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="gargona">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/ney.jpg" alt="gargona" />
    </section>

    <section class="memory-card" data-framework="yuko">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/vini.jpg" alt="yuko" />
    </section>

    <section class="memory-card" data-framework="tromp">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/doue.jpg" alt="tromp" />
    </section>

    <section class="memory-card" data-framework="mo">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/ya.jpg" alt="mo" />
    </section>

    <section class="memory-card" data-framework="woc">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/halland.jpg" alt="woc" />

    <section class="memory-card" data-framework="mia">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />

    <section class="memory-card" data-framework="tromp">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/doue.jpg" alt="tromp" />

    <section class="memory-card" data-framework="gargona">

      <img class="back-face" src="img/vini.jpg" alt="yuko" />
    </section>

    <section class="memory-card" data-framework="woc">
      <img class="front-face" src="img/svg/ucl.jpg" alt="MDM" />
      <img class="back-face" src="img/halland.jpg" alt="woc" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
